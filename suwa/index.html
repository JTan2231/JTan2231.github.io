<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Translate a daily Japanese sentence and reveal Suwa’s reference translation." />
    <meta name="color-scheme" content="light" />
    <link rel="canonical" href="https://joeytan.dev/suwa/" />
    <link rel="stylesheet" href="/suwa/style.css" />
    <script type="module" src="/suwa/daily.js"></script>
    <title>Suwa — Daily Japanese translation</title>
  </head>
  <body class="demo-page">
    <div class="wrap">
      <main class="demo">
        <p id="sentence" lang="ja"></p>
        <form id="translation-form" autocomplete="off" hidden>
          <label for="translation">translate</label>
          <div class="translation-field">
            <input id="translation" type="text" required />
          </div>
          <button type="submit">Submit</button>
        </form>
        <section id="reference" aria-label="Translation result" tabindex="-1" hidden>
          <p id="reference-text"></p>
          <p id="submitted-translation"></p>
        </section>
        <p id="challenge-status" class="meta" role="status"></p>
        <p id="attribution" class="meta" lang="ja" hidden><a id="source-link"></a></p>
        <noscript><p>Enable JavaScript to use the daily challenge.</p></noscript>
      </main>
      <footer class="site-footer">
        <nav aria-label="Suwa">
          <a href="https://apps.apple.com/us/app/suwa/id6818885180">Download on the App Store</a>
          <a href="/suwa/support/">Support</a>
          <a href="/suwa/privacy/">Privacy</a>
          <a href="/suwa/credits/">Credits</a>
        </nav>
      </footer>
    </div>
  </body>
</html>

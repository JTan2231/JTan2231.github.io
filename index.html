<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Joey Tan, Software Engineer"
    />
    <title>Joey Tan - Software Engineer</title>
    <style>
      :root {
        color-scheme: light;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #fff;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #fff;
        cursor: crosshair;
        touch-action: none;
      }
    </style>
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        "use strict";

        const canvas = document.getElementById("stage");
        const context = canvas.getContext("2d");
        const text = [
          { value: "Joey Tan", weight: 500, scale: 0.132 },
          { value: "Software Engineer", weight: 400, scale: 0.061 },
        ];
        const fontFamily = '"Times New Roman", Times, serif';
        const pointer = {
          active: false,
          x: 0,
          y: 0,
          vx: 0,
          vy: 0,
          lastX: 0,
          lastY: 0,
          lastTime: 0,
          radius: 48,
          seen: false,
        };
        const controls = {
          hover: null,
          pressed: null,
        };
        const dragState = {
          letter: null,
          pointerId: null,
          offsetX: 0,
          offsetY: 0,
          targetX: 0,
          targetY: 0,
          lastX: 0,
          lastY: 0,
          lastTime: 0,
          vx: 0,
          vy: 0,
        };

        let width = 0;
        let height = 0;
        let dpr = 1;
        let letters = [];
        let lastFrame = performance.now();
        let palette = getPalette();
        let cursorCollidable = true;

        const random = (min, max) => min + Math.random() * (max - min);
        const clamp = (value, min, max) =>
          Math.max(min, Math.min(max, value));
        const font = (size, weight) =>
          `${weight} ${size}px ${fontFamily}`;
        const maxLetterSpeed = () =>
          clamp(Math.min(width, height) * 1.28, 500, 920);

        function getCanvasPoint(event) {
          const rect = canvas.getBoundingClientRect();

          return {
            x: event.clientX - rect.left,
            y: event.clientY - rect.top,
          };
        }

        function getPalette() {
          return { background: "#fff", text: "#000" };
        }

        function resize() {
          endLetterDrag();
          width = window.innerWidth;
          height = window.innerHeight;
          dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
          canvas.width = Math.floor(width * dpr);
          canvas.height = Math.floor(height * dpr);
          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;
          context.setTransform(dpr, 0, 0, dpr, 0, 0);
          pointer.radius = clamp(Math.min(width, height) * 0.07, 28, 58);
          palette = getPalette();
          seedLetters();
        }

        function resolveLineSize(line, targetWidth, shortSide) {
          let size = clamp(shortSide * line.scale, 24, line.scale > 0.1 ? 118 : 58);
          context.font = font(size, line.weight);

          const measuredWidth = context.measureText(line.value).width;
          if (measuredWidth > targetWidth) {
            size *= targetWidth / measuredWidth;
          }

          return size;
        }

        function seedLetters() {
          const shortSide = Math.min(width, height);
          const targetWidth = width * 0.86;
          const lineSpecs = text.map((line) => ({
            ...line,
            size: resolveLineSize(line, targetWidth, shortSide),
          }));
          const gap = clamp(shortSide * 0.055, 18, 56);
          const totalHeight = lineSpecs[0].size + gap + lineSpecs[1].size;
          const startY = height / 2 - totalHeight / 2;

          letters = [];

          lineSpecs.forEach((line, lineIndex) => {
            context.font = font(line.size, line.weight);

            const widths = [...line.value].map((character) =>
              context.measureText(character).width
            );
            const lineWidth = widths.reduce((sum, value) => sum + value, 0);
            let x = width / 2 - lineWidth / 2;
            const y =
              startY +
              (lineIndex === 0 ? line.size / 2 : lineSpecs[0].size + gap + line.size / 2);

            [...line.value].forEach((character, index) => {
              const characterWidth = widths[index];
              if (character === " ") {
                x += characterWidth;
                return;
              }

              const measurement = context.measureText(character);
              const glyphHeight =
                measurement.actualBoundingBoxAscent +
                  measurement.actualBoundingBoxDescent || line.size;
              const radius = Math.max(
                7,
                Math.max(characterWidth * 0.52, glyphHeight * 0.34)
              );
              letters.push({
                character,
                x: x + characterWidth / 2,
                y,
                vx: 0,
                vy: 0,
                radius,
                mass: radius * radius,
                size: line.size,
                weight: line.weight,
                angle: 0,
                spin: 0,
              });

              x += characterWidth;
            });
          });
        }

        function resetPointer() {
          pointer.active = false;
          pointer.x = 0;
          pointer.y = 0;
          pointer.vx = 0;
          pointer.vy = 0;
          pointer.lastX = 0;
          pointer.lastY = 0;
          pointer.lastTime = 0;
          pointer.seen = false;
        }

        function resetCanvas() {
          endLetterDrag();
          cursorCollidable = true;
          controls.pressed = null;
          resetPointer();
          palette = getPalette();
          seedLetters();
          lastFrame = performance.now();
        }

        function updatePointer(event, point = getCanvasPoint(event)) {
          const now = performance.now();
          const { x, y } = point;

          if (pointer.seen) {
            const elapsed = Math.max((now - pointer.lastTime) / 1000, 1 / 120);
            const nextVx = (x - pointer.lastX) / elapsed;
            const nextVy = (y - pointer.lastY) / elapsed;
            pointer.vx = pointer.vx * 0.52 + nextVx * 0.48;
            pointer.vy = pointer.vy * 0.52 + nextVy * 0.48;
          }

          pointer.active = true;
          pointer.seen = true;
          pointer.x = x;
          pointer.y = y;
          pointer.lastX = x;
          pointer.lastY = y;
          pointer.lastTime = now;
        }

        function getLetterAt(x, y) {
          for (let index = letters.length - 1; index >= 0; index -= 1) {
            const letter = letters[index];
            const dx = x - letter.x;
            const dy = y - letter.y;

            if (dx * dx + dy * dy <= letter.radius * letter.radius) {
              return letter;
            }
          }

          return null;
        }

        function isDraggingLetter(letter) {
          return dragState.letter === letter;
        }

        function getFreshDragVelocity(multiplier = 1) {
          const staleTime = Math.max((performance.now() - dragState.lastTime) / 1000, 0);
          const freshness = Math.exp(-staleTime * 5.8);

          return {
            vx: dragState.vx * freshness * multiplier,
            vy: dragState.vy * freshness * multiplier,
          };
        }

        function positionDraggedLetter() {
          const letter = dragState.letter;

          if (!letter) {
            return;
          }

          letter.x = clamp(dragState.targetX, letter.radius, width - letter.radius);
          letter.y = clamp(dragState.targetY, letter.radius, height - letter.radius);
          const velocity = getFreshDragVelocity();
          letter.vx = velocity.vx;
          letter.vy = velocity.vy;
          letter.spin *= 0.72;
        }

        function updateDragVelocity(point) {
          const now = performance.now();

          if (dragState.lastTime > 0) {
            const elapsed = Math.max((now - dragState.lastTime) / 1000, 1 / 240);
            const nextVx = (point.x - dragState.lastX) / elapsed;
            const nextVy = (point.y - dragState.lastY) / elapsed;

            dragState.vx = dragState.vx * 0.2 + nextVx * 0.8;
            dragState.vy = dragState.vy * 0.2 + nextVy * 0.8;
          }

          dragState.lastX = point.x;
          dragState.lastY = point.y;
          dragState.lastTime = now;
        }

        function updateDraggedTarget(point) {
          if (!dragState.letter) {
            return;
          }

          updateDragVelocity(point);
          dragState.targetX = point.x + dragState.offsetX;
          dragState.targetY = point.y + dragState.offsetY;
          positionDraggedLetter();
        }

        function beginLetterDrag(event, letter, point) {
          dragState.letter = letter;
          dragState.pointerId = event.pointerId;
          dragState.offsetX = letter.x - point.x;
          dragState.offsetY = letter.y - point.y;
          dragState.targetX = letter.x;
          dragState.targetY = letter.y;
          dragState.lastX = point.x;
          dragState.lastY = point.y;
          dragState.lastTime = performance.now();
          dragState.vx = 0;
          dragState.vy = 0;
          letter.vx = 0;
          letter.vy = 0;
          letter.spin = 0;
          positionDraggedLetter();

          if (canvas.setPointerCapture) {
            canvas.setPointerCapture(event.pointerId);
          }
        }

        function applyReleaseMomentum(letter) {
          const launch = 1.38;
          const maxLaunchSpeed = maxLetterSpeed() * 1.45;
          const velocity = getFreshDragVelocity(launch);
          let vx = velocity.vx;
          let vy = velocity.vy;
          const speed = Math.hypot(vx, vy);

          if (speed > maxLaunchSpeed) {
            const scale = maxLaunchSpeed / speed;
            vx *= scale;
            vy *= scale;
          }

          letter.vx = vx;
          letter.vy = vy;
          letter.spin = clamp(
            letter.spin +
              ((dragState.offsetX * vy - dragState.offsetY * vx) /
                Math.max(letter.radius * letter.radius, 1)) *
                0.16,
            -4.6,
            4.6
          );
        }

        function endLetterDrag(event, releaseWithMomentum = false) {
          if (!dragState.letter) {
            return;
          }

          if (releaseWithMomentum) {
            applyReleaseMomentum(dragState.letter);
          }

          if (
            dragState.pointerId !== null &&
            canvas.hasPointerCapture &&
            canvas.hasPointerCapture(dragState.pointerId)
          ) {
            canvas.releasePointerCapture(dragState.pointerId);
          }

          dragState.letter = null;
          dragState.pointerId = null;
          dragState.offsetX = 0;
          dragState.offsetY = 0;
          dragState.targetX = 0;
          dragState.targetY = 0;
          dragState.lastX = 0;
          dragState.lastY = 0;
          dragState.lastTime = 0;
          dragState.vx = 0;
          dragState.vy = 0;
        }

        function collideWithWalls(letter) {
          const bounce = 0.86;

          if (letter.x - letter.radius < 0) {
            letter.x = letter.radius;
            letter.vx = Math.abs(letter.vx) * bounce;
            letter.spin += letter.vy * 0.002;
          } else if (letter.x + letter.radius > width) {
            letter.x = width - letter.radius;
            letter.vx = -Math.abs(letter.vx) * bounce;
            letter.spin -= letter.vy * 0.002;
          }

          if (letter.y - letter.radius < 0) {
            letter.y = letter.radius;
            letter.vy = Math.abs(letter.vy) * bounce;
            letter.spin -= letter.vx * 0.002;
          } else if (letter.y + letter.radius > height) {
            letter.y = height - letter.radius;
            letter.vy = -Math.abs(letter.vy) * bounce;
            letter.spin += letter.vx * 0.002;
          }
        }

        function collideWithPointer(letter) {
          if (!cursorCollidable || !pointer.active) {
            return;
          }

          const dx = letter.x - pointer.x;
          const dy = letter.y - pointer.y;
          const minDistance = letter.radius + pointer.radius;
          const distanceSquared = dx * dx + dy * dy;

          if (distanceSquared >= minDistance * minDistance) {
            return;
          }

          const distance = Math.sqrt(distanceSquared) || 0.0001;
          const nx = dx / distance;
          const ny = dy / distance;
          const overlap = minDistance - distance;
          const pointerVelocity = pointer.vx * nx + pointer.vy * ny;
          const letterVelocity = letter.vx * nx + letter.vy * ny;
          const separationImpulse = overlap * 3.2 + 12;
          const malletImpulse = Math.max(0, pointerVelocity) * 0.56;

          letter.x += nx * overlap;
          letter.y += ny * overlap;

          if (letterVelocity < 0) {
            letter.vx -= nx * letterVelocity * 1.9;
            letter.vy -= ny * letterVelocity * 1.9;
          }

          letter.vx += nx * (separationImpulse + malletImpulse);
          letter.vy += ny * (separationImpulse + malletImpulse);
          letter.vx += pointer.vx * 0.12;
          letter.vy += pointer.vy * 0.12;
          letter.spin += (pointer.vx * -ny + pointer.vy * nx) * 0.004;
        }

        function collideLetters(a, b) {
          const aPinned = isDraggingLetter(a);
          const bPinned = isDraggingLetter(b);

          if (aPinned && bPinned) {
            return;
          }

          let dx = b.x - a.x;
          let dy = b.y - a.y;
          const minDistance = a.radius + b.radius;
          let distanceSquared = dx * dx + dy * dy;

          if (distanceSquared >= minDistance * minDistance) {
            return;
          }

          if (distanceSquared === 0) {
            const angle = random(0, Math.PI * 2);
            dx = Math.cos(angle) * 0.01;
            dy = Math.sin(angle) * 0.01;
            distanceSquared = dx * dx + dy * dy;
          }

          const rvx = b.vx - a.vx;
          const rvy = b.vy - a.vy;
          const distance = Math.sqrt(distanceSquared);
          const nx = dx / distance;
          const ny = dy / distance;
          const velocityAlongNormal = rvx * nx + rvy * ny;
          const overlap = minDistance - distance;
          const inverseMassA = aPinned ? 0 : 1 / a.mass;
          const inverseMassB = bPinned ? 0 : 1 / b.mass;
          const inverseMassTotal = inverseMassA + inverseMassB;

          if (inverseMassTotal === 0) {
            return;
          }

          a.x -= nx * overlap * (inverseMassA / inverseMassTotal);
          a.y -= ny * overlap * (inverseMassA / inverseMassTotal);
          b.x += nx * overlap * (inverseMassB / inverseMassTotal);
          b.y += ny * overlap * (inverseMassB / inverseMassTotal);

          if (velocityAlongNormal >= 0) {
            return;
          }

          const restitution = 0.88;
          const impulse =
            (-(1 + restitution) * velocityAlongNormal) /
            inverseMassTotal;
          const impulseX = impulse * nx;
          const impulseY = impulse * ny;
          const tangentVelocity = rvx * -ny + rvy * nx;

          if (!aPinned) {
            a.vx -= impulseX * inverseMassA;
            a.vy -= impulseY * inverseMassA;
            a.spin -= tangentVelocity * 0.002;
          }

          if (!bPinned) {
            b.vx += impulseX * inverseMassB;
            b.vy += impulseY * inverseMassB;
            b.spin += tangentVelocity * 0.002;
          }
        }

        function limitVelocity(letter) {
          const maxSpeed = maxLetterSpeed();
          const speed = Math.hypot(letter.vx, letter.vy);

          if (speed > maxSpeed) {
            const scale = maxSpeed / speed;
            letter.vx *= scale;
            letter.vy *= scale;
          }

          letter.spin = clamp(letter.spin, -4.6, 4.6);
        }

        function applyFriction(letter, dt) {
          const speed = Math.hypot(letter.vx, letter.vy);
          if (speed === 0) {
            return;
          }

          const speedRatio = clamp(speed / maxLetterSpeed(), 0, 1);
          const friction = 0.025 + 2.25 * Math.pow(speedRatio, 0.82);
          const drag = Math.exp(-friction * dt);

          letter.vx *= drag;
          letter.vy *= drag;
        }

        function step(dt) {
          const spinDrag = Math.pow(0.993, dt * 60);

          letters.forEach((letter) => {
            if (isDraggingLetter(letter)) {
              positionDraggedLetter();
              return;
            }

            applyFriction(letter, dt);
            letter.spin *= spinDrag;
            letter.x += letter.vx * dt;
            letter.y += letter.vy * dt;
            letter.angle += letter.spin * dt;
            collideWithWalls(letter);
            collideWithPointer(letter);
            limitVelocity(letter);
          });

          for (let pass = 0; pass < 3; pass += 1) {
            for (let index = 0; index < letters.length; index += 1) {
              for (let other = index + 1; other < letters.length; other += 1) {
                collideLetters(letters[index], letters[other]);
              }
            }

            positionDraggedLetter();
          }

          letters.forEach((letter) => {
            if (isDraggingLetter(letter)) {
              positionDraggedLetter();
              return;
            }

            collideWithWalls(letter);
            limitVelocity(letter);
          });

          pointer.vx *= Math.pow(0.84, dt * 60);
          pointer.vy *= Math.pow(0.84, dt * 60);
        }

        function getControlRects() {
          const size = clamp(Math.min(width, height) * 0.052, 36, 44);
          const margin = clamp(Math.min(width, height) * 0.018, 12, 18);
          const gap = 8;
          const top = margin;
          const resetX = width - margin - size;

          return [
            {
              id: "collision",
              x: resetX - gap - size,
              y: top,
              width: size,
              height: size,
            },
            {
              id: "reset",
              x: resetX,
              y: top,
              width: size,
              height: size,
            },
          ];
        }

        function getHitControl(x, y) {
          return getControlRects().find(
            (control) =>
              x >= control.x &&
              x <= control.x + control.width &&
              y >= control.y &&
              y <= control.y + control.height
          );
        }

        function roundedRect(x, y, widthValue, heightValue, radius) {
          const corner = Math.min(radius, widthValue / 2, heightValue / 2);

          context.beginPath();
          context.moveTo(x + corner, y);
          context.lineTo(x + widthValue - corner, y);
          context.quadraticCurveTo(x + widthValue, y, x + widthValue, y + corner);
          context.lineTo(x + widthValue, y + heightValue - corner);
          context.quadraticCurveTo(
            x + widthValue,
            y + heightValue,
            x + widthValue - corner,
            y + heightValue
          );
          context.lineTo(x + corner, y + heightValue);
          context.quadraticCurveTo(x, y + heightValue, x, y + heightValue - corner);
          context.lineTo(x, y + corner);
          context.quadraticCurveTo(x, y, x + corner, y);
          context.closePath();
        }

        function drawResetIcon(control) {
          const centerX = control.x + control.width / 2;
          const centerY = control.y + control.height / 2;
          const radius = control.width * 0.21;
          const start = -Math.PI * 0.18;
          const end = Math.PI * 1.25;
          const arrowX = centerX + Math.cos(start) * radius;
          const arrowY = centerY + Math.sin(start) * radius;

          context.beginPath();
          context.arc(centerX, centerY, radius, start, end, false);
          context.stroke();

          context.beginPath();
          context.moveTo(arrowX, arrowY);
          context.lineTo(arrowX - control.width * 0.02, arrowY - control.width * 0.17);
          context.moveTo(arrowX, arrowY);
          context.lineTo(arrowX - control.width * 0.16, arrowY - control.width * 0.02);
          context.stroke();
        }

        function drawCollisionIcon(control) {
          const centerX = control.x + control.width * 0.58;
          const centerY = control.y + control.height * 0.46;
          const radius = control.width * 0.18;
          const left = control.x + control.width * 0.31;
          const top = control.y + control.height * 0.24;
          const tipX = control.x + control.width * 0.67;
          const tipY = control.y + control.height * 0.58;
          const tailX = control.x + control.width * 0.44;
          const tailY = control.y + control.height * 0.68;
          const notchX = control.x + control.width * 0.44;
          const notchY = control.y + control.height * 0.48;

          context.beginPath();
          context.moveTo(left, top);
          context.lineTo(tipX, tipY);
          context.lineTo(control.x + control.width * 0.51, control.y + control.height * 0.6);
          context.lineTo(tailX, tailY);
          context.lineTo(control.x + control.width * 0.36, control.y + control.height * 0.72);
          context.lineTo(notchX, notchY);
          context.closePath();
          context.stroke();

          if (cursorCollidable) {
            context.beginPath();
            context.arc(centerX, centerY, radius, 0, Math.PI * 2);
            context.stroke();
          } else {
            context.beginPath();
            context.moveTo(centerX - radius * 0.92, centerY + radius * 0.92);
            context.lineTo(centerX + radius * 0.92, centerY - radius * 0.92);
            context.stroke();
          }
        }

        function drawControls() {
          // DOM-less controls: buttons are drawn on the canvas and hit-tested here.
          getControlRects().forEach((control) => {
            const isActive = control.id === "collision" && cursorCollidable;
            const isHovered = controls.hover === control.id;
            const isPressed = controls.pressed === control.id;
            const offset = isPressed ? 1 : 0;

            context.save();
            context.translate(offset, offset);
            roundedRect(control.x, control.y, control.width, control.height, 8);
            context.fillStyle = isActive
              ? "#111"
              : isHovered
                ? "rgba(246, 246, 246, 0.96)"
                : "rgba(255, 255, 255, 0.88)";
            context.strokeStyle = isActive ? "#111" : "rgba(0, 0, 0, 0.74)";
            context.lineWidth = 1;
            context.fill();
            context.stroke();

            context.strokeStyle = isActive ? "#fff" : "#111";
            context.fillStyle = isActive ? "#fff" : "#111";
            context.lineWidth = 1.9;
            context.lineCap = "round";
            context.lineJoin = "round";

            if (control.id === "collision") {
              drawCollisionIcon(control);
            } else {
              drawResetIcon(control);
            }

            context.restore();
          });
        }

        function updateCanvasCursor(point, hitControl) {
          if (dragState.letter) {
            canvas.style.cursor = "grabbing";
            return;
          }

          if (hitControl) {
            canvas.style.cursor = "pointer";
            return;
          }

          if (!cursorCollidable && point && getLetterAt(point.x, point.y)) {
            canvas.style.cursor = "grab";
            return;
          }

          canvas.style.cursor = cursorCollidable ? "crosshair" : "default";
        }

        function updateControlHover(point) {
          const hitControl = getHitControl(point.x, point.y);
          controls.hover = hitControl ? hitControl.id : null;
          updateCanvasCursor(point, hitControl);

          return hitControl;
        }

        function handlePointerMove(event) {
          const point = getCanvasPoint(event);

          if (dragState.letter) {
            if (event.pointerId !== dragState.pointerId) {
              return;
            }

            event.preventDefault();
            updatePointer(event, point);
            updateDraggedTarget(point);
            updateCanvasCursor(point, null);
            return;
          }

          const hitControl = updateControlHover(point);

          if (hitControl) {
            resetPointer();
            return;
          }

          updatePointer(event, point);
        }

        function handlePointerDown(event) {
          const point = getCanvasPoint(event);
          const hitControl = updateControlHover(point);

          if (hitControl) {
            event.preventDefault();
            controls.pressed = hitControl.id;
            endLetterDrag(event);
            resetPointer();

            if (hitControl.id === "collision") {
              cursorCollidable = !cursorCollidable;
            } else {
              resetCanvas();
            }

            updateCanvasCursor(point, hitControl);
            return;
          }

          controls.pressed = null;
          updatePointer(event, point);

          if (!cursorCollidable) {
            const letter = getLetterAt(point.x, point.y);

            if (letter) {
              event.preventDefault();
              beginLetterDrag(event, letter, point);
              updateCanvasCursor(point, null);
            }
          }
        }

        function handlePointerUp(event) {
          if (dragState.letter && event.pointerId === dragState.pointerId) {
            const point = getCanvasPoint(event);
            const dx = point.x - dragState.lastX;
            const dy = point.y - dragState.lastY;

            event.preventDefault();
            updatePointer(event, point);

            if (dx * dx + dy * dy > 0.25) {
              updateDraggedTarget(point);
            }

            endLetterDrag(event, true);
            updateCanvasCursor(point, null);
          }

          controls.pressed = null;
        }

        function handlePointerLeave() {
          controls.hover = null;
          controls.pressed = null;
          updateCanvasCursor(null, null);

          if (dragState.letter) {
            return;
          }

          resetPointer();
        }

        function handlePointerCancel(event) {
          endLetterDrag(event);
          handlePointerLeave();
        }

        function render() {
          context.fillStyle = palette.background;
          context.fillRect(0, 0, width, height);
          context.textAlign = "center";
          context.textBaseline = "middle";
          context.fillStyle = palette.text;

          letters.forEach((letter) => {
            context.save();
            context.translate(letter.x, letter.y);
            context.rotate(letter.angle);
            context.font = font(letter.size, letter.weight);
            context.fillText(letter.character, 0, 0);
            context.restore();
          });

          drawControls();
        }

        function frame(now) {
          const elapsed = Math.min((now - lastFrame) / 1000, 0.05);
          const steps = Math.max(1, Math.ceil(elapsed / (1 / 120)));
          const dt = elapsed / steps;

          lastFrame = now;

          for (let index = 0; index < steps; index += 1) {
            step(dt);
          }

          render();
          requestAnimationFrame(frame);
        }

        canvas.addEventListener("pointermove", handlePointerMove);
        canvas.addEventListener("pointerdown", handlePointerDown);
        canvas.addEventListener("pointerup", handlePointerUp);
        canvas.addEventListener("pointercancel", handlePointerCancel);
        canvas.addEventListener("pointerleave", handlePointerLeave);
        window.addEventListener("resize", resize);
        resize();
        requestAnimationFrame(frame);
      });
    </script>
  </head>
  <body>
    <canvas
      id="stage"
      role="application"
      aria-label="Interactive canvas spelling Joey Tan, Software Engineer, with canvas-drawn controls for cursor collision and reset"
    ></canvas>
  </body>
</html>

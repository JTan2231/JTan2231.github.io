<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Joey Tan"
    />
    <title>Joey Tan</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        background: #fafafa;
        color: #1b1b1a;
      }

      * {
        box-sizing: border-box;
        -webkit-user-select: none;
        user-select: none;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #fafafa;
      }

      main {
        width: min(100% - 48px, 560px);
        transform: translateY(-7vh);
        text-align: center;
      }

      h1 {
        margin: 0 0 28px;
        font-size: 24px;
        font-weight: 500;
        letter-spacing: -0.02em;
      }

      ul {
        display: grid;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      li {
        font-size: 15px;
        line-height: 1.5;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      a:hover,
      a:active,
      a:visited {
        color: inherit;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 1px solid #1b1b1a;
        outline-offset: 4px;
      }

      .subtitle {
        color: #a5a5a2;
      }

      @media (max-width: 520px) {
        main {
          width: min(100% - 36px, 560px);
        }

        h1 {
          margin-bottom: 24px;
          font-size: 22px;
        }

        li {
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="name">
      <h1 id="name">Joey Tan</h1>
      <ul aria-label="Projects">
        <li>
          <a href="https://github.com/JTan2231/cell" draggable="false">Cell</a>
          <span class="subtitle"> — Multi-agent coordination and knowledge infrastructure</span>
        </li>
        <li>
          <a href="https://wrought.joeytan.dev" draggable="false">Wrought</a>
          <span class="subtitle"> — Generative narrative engine</span>
        </li>
      </ul>
    </main>
  </body>
</html>

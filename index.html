<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Joey Tan — Software Engineer." />
    <meta name="color-scheme" content="light" />
    <title>Joey Tan</title>
    <link rel="stylesheet" href="/assets/home.css" />
    <script src="/assets/home.js" defer></script>
  </head>
  <body>
    <div class="site" data-open="false">
      <div class="screen-surface">
        <video class="project-video" preload="none" muted loop playsinline disablepictureinpicture aria-hidden="true" tabindex="-1"></video>
        <canvas class="screen-canvas" aria-hidden="true" hidden></canvas>
        <div class="screen-content">
          <main aria-labelledby="name">
            <h1 id="name">Joey Tan</h1>
            <p class="blurb">
              Software Engineer<br />
              I enjoy difficult systems.
            </p>
            <ul class="projects" aria-label="Projects">
              <li>
                <a class="project-trigger" href="https://github.com/JTan2231/telete"
                  data-project="telete"
                  data-description="I often found myself waiting on other agents to finish their work or wrangling Git worktrees, either myself or through another agent. I don't like worrying about how to work while working, so I built Telete to manage the flow of changes as I work with multiple agents in parallel.">
                  <span class="project-name">Telete</span>
                  <span class="subtitle">Agent concurrency manager</span>
                </a>
              </li>
              <li>
                <a class="project-trigger" href="https://wrought.experimental.joeytan.dev"
                  data-project="wrought"
                  data-description="A generative narrative engine. An exploration of how authored structure and generated material can come together to create stories that unfold through interaction.">
                  <span class="project-name">Wrought</span>
                  <span class="subtitle">Narrative tabletop management</span>
                </a>
              </li>
              <li>
                <a class="project-trigger" href="https://taifu.joeytan.dev"
                  data-project="taifu"
                  data-video="/assets/videos/taifu-montage.mp4?v=2"
                  data-description="I want to get better at system design. I don’t want to have to seek out problems or feedback. Taifu gives you both: everyday, a new problem and chance to see how your design stacks up against what AI would have done.">
                  <span class="project-name">Taifu</span>
                  <span class="subtitle">Training system design</span>
                </a>
              </li>
            </ul>
          </main>
          <section class="projection" id="project-display" aria-labelledby="project-title" hidden>
            <div class="project-heading">
              <h2 class="project-title" id="project-title"><a class="project-link"></a></h2>
              <button class="project-close" type="button">Close</button>
            </div>
            <p class="project-description"></p>
          </section>
        </div>
        <div class="screen-shadow" aria-hidden="true"></div>
      </div>
      <span class="sr-only" role="status" aria-live="polite" id="project-status"></span>
    </div>
  </body>
</html>
